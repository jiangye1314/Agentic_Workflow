<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 牧童MES</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f8f9fa;color:#24292e;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  .login-card{
    width:360px;background:#fff;border:1px solid #e1e4e8;border-radius:10px;
    padding:40px 36px;box-shadow:0 4px 16px rgba(0,0,0,.06);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .badge{
    font-family:"SF Mono",Menlo,Consolas,monospace;font-weight:700;font-size:13px;
    background:#1f6feb;color:#fff;padding:4px 8px;border-radius:5px;letter-spacing:.5px;
  }
  .title{font-size:20px;font-weight:600}
  .subtitle{color:#6a737d;font-size:13px;margin:6px 0 28px}
  label{display:block;font-size:13px;color:#24292e;margin:14px 0 6px;font-weight:500}
  input{
    width:100%;height:40px;padding:0 12px;font-size:14px;color:#24292e;
    border:1px solid #e1e4e8;border-radius:6px;outline:none;background:#fff;
  }
  input:focus{border-color:#1f6feb;box-shadow:0 0 0 3px rgba(31,111,235,.12)}
  button{
    width:100%;height:42px;margin-top:24px;font-size:15px;font-weight:600;color:#fff;
    background:#1f6feb;border:none;border-radius:6px;cursor:pointer;
  }
  button:hover{background:#1a5fd0}
  button:disabled{background:#8ab4f8;cursor:not-allowed}
  .error{
    display:none;margin-top:14px;padding:10px 12px;font-size:13px;
    background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:6px;
  }
  .tip{
    margin-top:22px;font-size:12px;color:#6a737d;
    border-top:1px solid #e1e4e8;padding-top:14px;line-height:1.8;
  }
  .tip code{
    font-family:"SF Mono",Menlo,Consolas,monospace;background:#f6f8fa;
    padding:1px 5px;border-radius:4px;color:#24292e;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <span class="badge">MES</span>
    <span class="title">牧童MES · 物料监控平台</span>
  </div>
  <div class="subtitle">物料看板 · HITL 审批 · Agent 分析</div>
  <form id="loginForm">
    <label for="username">用户名</label>
    <input id="username" type="text" autocomplete="username" placeholder="请输入用户名">
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    <div class="error" id="error"></div>
    <button type="submit" id="btn">登 录</button>
  </form>
  <div class="tip">
    演示账号 <code>admin</code> / <code>123456</code><br>
    可在 <code>.env</code> 中通过 <code>DEMO_USERNAME</code>、<code>DEMO_PASSWORD</code> 修改
  </div>
</div>
<script>
// 已登录则直接进系统
(async()=>{
  try{
    const r=await fetch('/api/auth/me');
    const d=await r.json();
    if(d.code===0 && d.data && d.data.logged_in){location.href='/';}
  }catch(e){}
})();
document.getElementById('loginForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn'),err=document.getElementById('error');
  btn.disabled=true;err.style.display='none';
  try{
    const r=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:document.getElementById('username').value.trim(),
        password:document.getElementById('password').value,
      }),
    });
    const d=await r.json();
    if(d.code===0){location.href='/';return;}
    err.textContent=d.message||'登录失败';err.style.display='block';
  }catch(ex){
    err.textContent='网络异常，请稍后重试';err.style.display='block';
  }finally{
    btn.disabled=false;
  }
});
</script>
</body>
</html>
